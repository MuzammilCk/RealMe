      name="description"
      content="The Diary of Me — a spatial portfolio. Open the diary to read the story of a software engineer who also runs a hardware shop."

    <!-- Fonts are delivered via @fontsource (imported in main.tsx), so the

    <!-- CSP: Allow inline styles for dynamic token values (if needed).
         font-src 'self' covers the bundled, hashed woff2 assets. -->
    <meta http-equiv="Content-Security-Policy" content="style-src 'self' 'unsafe-inline'; font-src 'self' data:;" />
  </head>
